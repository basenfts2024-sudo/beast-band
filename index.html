<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><meta name="description" content="BEAST"><title>BEAST</title><style>html,body{margin:0;background:#f5f4ef;color:#0b0b0b;font-family:Arial,Helvetica,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}</style></head><body><div id="boot">Loading BEAST…</div><div id="root"></div><script>(async()=>{try{const css=await Promise.all([1,2,3,4,5].map(i=>fetch('styles-'+i+'.css?v=3').then(r=>{if(!r.ok)throw new Error('CSS '+i);return r.text()})));const st=document.createElement('style');st.textContent=css.join('');document.head.appendChild(st);const js=await Promise.all([1,2,3,4,5,6,7,8,9].map(i=>fetch('app-'+i+'.js?v=3').then(r=>{if(!r.ok)throw new Error('JS '+i);return r.text()})));document.getElementById('boot')?.remove();(0,eval)(js.join(''));}catch(e){document.getElementById('boot').textContent='BEAST failed to load — '+e.message;console.error(e)}})();</script></body></html>
