<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>BEAST Admin</title><style>html,body{margin:0;background:#f5f4ef;color:#0b0b0b;font-family:Arial,Helvetica,sans-serif}.admin-loading{min-height:100vh;display:grid;place-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}</style></head><body><div id="app"><div class="admin-loading">Loading BEAST editor…</div></div><script>(async()=>{try{const cssFiles=['cms-admin-css-01.part'];const jsFiles=['cms-admin-js-01.part','cms-admin-js-02.part','cms-admin-js-03.part'];const css=(await Promise.all(cssFiles.map(f=>fetch(f+'?v=2').then(r=>{if(!r.ok)throw new Error('Missing '+f);return r.text()})))).join('\n');const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);const js=(await Promise.all(jsFiles.map(f=>fetch(f+'?v=2').then(r=>{if(!r.ok)throw new Error('Missing '+f);return r.text()})))).join('\n');(0,eval)(js);}catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="admin-loading">BEAST CMS failed to load — '+String(e.message||e)+'</div>';}})();</script></body></html>
